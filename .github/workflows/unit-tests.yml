name: Unit Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out Python core dependency
        run: |
          git clone --no-checkout https://github.com/kws/deckr-core-python.git ../deckr-core-python
          git -C ../deckr-core-python checkout "$(cat .deckr-core-revision)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libhidapi-dev libusb-1.0-0-dev

      - name: Build Python core wheel
        run: cd ../deckr-core-python && uv build --wheel

      - name: Install dependencies
        run: uv sync --no-sources --dev --find-links ../deckr-core-python/dist

      - name: Run unit tests with coverage
        run: uv run --no-sync pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage.xml
          path: coverage.xml
